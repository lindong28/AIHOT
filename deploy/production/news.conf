# Existing hostname, certificate and HTTPS boundary; AIHOT Web owns public routing.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name news.aiplanet.live;
    ssl_certificate /etc/letsencrypt/live/news.aiplanet.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.aiplanet.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/news.aiplanet.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.aiplanet.live/privkey.pem;
    return 444;
}
